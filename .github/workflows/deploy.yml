name: Publish root news site

on:
  push:
    branches: [master]
    paths: ['deployment/**', '.github/workflows/deploy.yml']
  pull_request:
    branches: [master]
    paths: ['deployment/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-news-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: deployment-repo
          persist-credentials: false
      - name: Validate publication request
        working-directory: deployment-repo
        run: |
          node -e 'const r=require("./deployment/source.json"); if(r.schema!==1||r.repository!=="danyow/danyow"||r.branch!=="main"||! /^[a-f0-9]{40}$/.test(r.source_sha)) throw Error("INVALID_PUBLICATION_REQUEST")'
      - uses: actions/checkout@v7
        with:
          repository: danyow/danyow
          ref: main
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve latest approved source without rolling back newer reports
        id: source
        working-directory: source
        run: |
          requested=$(node -p 'require("../deployment-repo/deployment/source.json").source_sha')
          git merge-base --is-ancestor "$requested" HEAD
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install locked dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test archive and preserved content
        working-directory: source
        run: npm test
      - name: Type check
        working-directory: source
        env:
          SITE_BASE_URL: /
        run: npm run check
      - name: Build the actual root site and check internal links
        working-directory: source
        env:
          SITE_BASE_URL: /
          SITE_URL: https://danyow.cn
        run: npm run build
      - name: Require root canonical URLs and write publication receipt
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node ../deployment-repo/deployment/check-root.mjs
          printf 'danyow.cn\n' > dist/CNAME
          touch dist/.nojekyll
          mkdir -p dist/.well-known
          node -e 'require("fs").writeFileSync("dist/.well-known/danyow-deployment.json",JSON.stringify({schema:1,source_repository:"danyow/danyow",source_commit:process.env.SOURCE_SHA,request_commit:process.env.GITHUB_SHA,base:"/",built_at:new Date().toISOString()})+"\n")'
      - uses: actions/upload-artifact@v7
        with:
          name: root-website
          path: source/dist
          include-hidden-files: true
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: danyow/danyow
          ref: ${{ needs.build.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: root-website
          path: source/dist
      - name: Publish to the repository already bound to danyow.cn
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: source/dist
          publish_branch: gh-pages
          cname: danyow.cn
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
      - name: Verify root pages and every recent report version
        working-directory: source
        env:
          SITE_BASE_URL: /
          SITE_URL: https://danyow.cn
        run: node scripts/verify-deployment.mjs
      - name: Verify public source receipt
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          node --input-type=module <<'NODE'
          import {setTimeout as sleep} from 'node:timers/promises';
          const source=process.env.SOURCE_SHA, request=process.env.GITHUB_SHA;
          if(!/^[a-f0-9]{40}$/.test(source||'')||!/^[a-f0-9]{40}$/.test(request||''))throw Error('INVALID_EXPECTED_RECEIPT');
          const deadline=Date.now()+180000;
          let verified=false;
          for(let attempt=1;attempt<=13&&Date.now()<deadline;attempt++){
            try{
              const url=new URL('https://danyow.cn/.well-known/danyow-deployment.json');
              url.searchParams.set('verify',source+'-'+request+'-'+attempt);
              const response=await fetch(url,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(10000)});
              if(!response.ok)throw Error('ROOT_RECEIPT_HTTP_'+response.status);
              const receipt=await response.json();
              if(receipt.schema!==1||receipt.source_repository!=='danyow/danyow'||receipt.source_commit!==source||receipt.request_commit!==request||receipt.base!=='/')throw Error('ROOT_RECEIPT_VERSION_PENDING');
              console.log(JSON.stringify({rootReceipt:'verified',source_commit:source,request_commit:request,base:'/',attempts:attempt}));
              verified=true;break;
            }catch(error){
              console.log('Waiting for root publication receipt: '+String(error.message).slice(0,120));
              if(attempt<13&&Date.now()<deadline)await sleep(Math.min(15000,Math.max(0,deadline-Date.now())));
            }
          }
          if(!verified)throw Error('ROOT_RECEIPT_NOT_VERIFIED_WITHIN_THREE_MINUTES');
          NODE
